name: BIO-MIMIC X Strict Bridge Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-bridge-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Probe Cynops strict phylogenetic chain
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,str(Path("factory").resolve()))
          import human_bridge as h

          species="Cynops pyrrhogaster"
          seed=h.PHYLO_SEEDS[species][0]
          candidate={"subject":species,"pmid_sources":["PMID:34944708","PMID:41751333","PMID:42702818","PMID:39595071"]}

          out={"seed":seed}
          out["uniprot_raw"]=h.uniprot_entry(seed["animal_uniprot"])
          out["uniprot_exact"]=h.uniprot_exact_species_gene(
              seed["animal_uniprot"],species,seed["animal_gene"],seed["animal_taxon_id"]
          )
          try:
              out["open_targets"]=h.opentarget_context(seed["human_ensembl_id"])
          except Exception as e:
              out["open_targets_error"]=repr(e)
          out["claim_pmids"]=[str(x).replace("PMID:","") for x in candidate["pmid_sources"]]
          bridges,stats=h.strict_phylogenetic_bridges_for_candidate(candidate)
          out["bridges"]=bridges
          out["stats"]=stats
          print(json.dumps(out,indent=2)[:40000])
          PY
