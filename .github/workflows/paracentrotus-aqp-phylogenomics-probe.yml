name: Paracentrotus AQP Phylogenomics Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paracentrotus-aqp-phylogenomics-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download published Paracentrotus orthogroups
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/orthogroups.txt.gz             https://raw.githubusercontent.com/paracentrotus/genome/main/duplications/orthologous_groups.txt.gz
          gzip -t /tmp/orthogroups.txt.gz
          echo "bytes=$(stat -c%s /tmp/orthogroups.txt.gz)"

      - name: Resolve human aquaporin Ensembl IDs and inspect orthogroups
        run: |
          python - <<'PY'
          import gzip,json,re,urllib.parse,urllib.request
          syms=["AQP0","AQP1","AQP2","AQP3","AQP4","AQP5","AQP6","AQP7","AQP8","AQP9","AQP10","AQP11","AQP12A","AQP12B"]
          headers={"Content-Type":"application/json","User-Agent":"BIO-MIMIC-X/1.0"}
          ids={}
          for s in syms:
              url="https://rest.ensembl.org/xrefs/symbol/homo_sapiens/"+urllib.parse.quote(s)+"?external_db=HGNC"
              req=urllib.request.Request(url,headers=headers)
              try:
                  rows=json.load(urllib.request.urlopen(req,timeout=20))
              except Exception as e:
                  rows=[]
              ens=sorted({x.get("id") for x in rows if str(x.get("id","")).startswith("ENSG")})
              ids[s]=ens
          print("AQP_ENSEMBL_IDS",json.dumps(ids,sort_keys=True))
          target="ENSG00000165272"
          hits=[]
          with gzip.open("/tmp/orthogroups.txt.gz","rt",encoding="utf-8",errors="replace") as fh:
              for line in fh:
                  if target in line:
                      hits.append(line.rstrip())
          print("AQP3_ORTHOGROUP_HITS",len(hits))
          for line in hits:
              print("ORTHOGROUP",line)

          # For every orthogroup containing a human AQP, show all human AQP symbols
          # and exact Paracentrotus gene IDs in the same family.
          rev={eid:s for s,es in ids.items() for eid in es}
          aqp_ids=set(rev)
          found=[]
          with gzip.open("/tmp/orthogroups.txt.gz","rt",encoding="utf-8",errors="replace") as fh:
              for line in fh:
                  if not any(eid in line for eid in aqp_ids):
                      continue
                  fid,genes=line.rstrip().split("\t",1)
                  toks=genes.split()
                  humans=[g.split("_",1)[1] for g in toks if g.startswith("Homsap_")]
                  par=[g.split("_",1)[1] for g in toks if g.startswith("Parliv_")]
                  human_aqps=[(x,rev[x]) for x in humans if x in rev]
                  if human_aqps:
                      found.append({"family":fid,"human_aqps":human_aqps,"all_human":humans,"parliv":par})
          print("AQP_FAMILIES",json.dumps(found,sort_keys=True))
          exact=[x for x in found if any(sym=="AQP3" for _,sym in x["human_aqps"])]
          assert exact, "No orthogroup containing human AQP3"
          print("AQP3_FAMILY_COUNT",len(exact))
          for x in exact:
              print("AQP3_FAMILY",json.dumps(x,sort_keys=True))
          PY

      - name: Gate evidence shape
        run: |
          python - <<'PY'
          print("PASS: probe completed; promotion requires downstream paralog discrimination, not orthogroup membership alone")
          PY
