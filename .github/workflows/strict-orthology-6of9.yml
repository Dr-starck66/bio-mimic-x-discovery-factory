name: BIO-MIMIC X Strict Orthology 6-of-9 Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-orthology-6of9.yml'

permissions:
  contents: write

concurrency:
  group: biomimic-strict-orthology-6of9
  cancel-in-progress: true

jobs:
  strict-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Human Bridge tests
        run: python -m unittest tests.test_human_bridge tests.test_translation_paths -v

      - name: Recompute Human Bridge
        run: python human_bridge_refresh.py

      - name: Require strict 6-of-9 and translation 9-of-9
        run: |
          python - <<'PY'
          import json, pathlib
          x=json.loads(pathlib.Path("state/factory/latest.json").read_text(encoding="utf-8"))
          h=x["human_bridge_result"]
          t=x["human_translation_result"]
          print({
            "supported_claims":len(x["claims"]),
            "strict":t["strict_orthology_candidates"],
            "strict_ratio":t["strict_orthology_coverage_ratio"],
            "translation":t["translation_verified_candidates"],
            "translation_ratio":t["translation_coverage_ratio"],
            "providers":h["provider_status"],
            "candidate_status":h["candidate_status"]
          })
          assert len(x["claims"])==9
          assert h["attempted_candidates"]==9
          assert t["strict_orthology_candidates"]>=6, t["candidate_status"]
          assert t["translation_verified_candidates"]==9
          assert t["translation_coverage_ratio"]==1.0
          assert all(p.get("clinical_efficacy_claim") is False for p in t["paths"])
          PY

      - name: Persist verified strict state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BIO-MIMIC-X-STRICT-GATE"
          git config user.email "biomimic-x-strict@users.noreply.github.com"
          git add state/factory/latest.json public/data/factory/latest.json reports/factory/HUMAN-BRIDGE-LATEST.md
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "bridge: persist strict orthology 6-of-9"
            git push origin HEAD:main
          fi
