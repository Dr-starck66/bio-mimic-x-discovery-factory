name: BIO-MIMIC X — UI and Scientific Acceptance
on:
  workflow_dispatch:
    inputs:
      science_mode:
        description: 'Optional evidence-only GEO operation (no recurring run)'
        required: false
        type: choice
        options:
          - default
          - gse295849_qc
          - gse295849_clock
          - gse295849_metadata
          - gse295849_paired
        default: default
  pull_request:
    branches: [main]
    paths:
      - 'qa/**'
      - 'organization/**'
      - 'factory/human_limb_regeneration_gate.py'
      - 'validation/hand2_legacy_crosswalk.py'
      - 'validation/hand2_assembly_sequence_probe.py'
      - 'validation/hand1_hand2_global_alignment.py'
      - 'validation/axolotl_paralog_panel.py'
      - 'tests/test_axolotl_paralog_panel.py'
      - 'tests/test_hand1_hand2_global_alignment.py'
      - 'tests/test_hand2_assembly_sequence_probe.py'
      - 'tests/test_hand2_legacy_crosswalk.py'
      - 'validation/geo_pair_probe.py'
      - 'validation/gse295849_real_qc.py'
      - 'tests/test_gse295849_real_qc.py'
      - 'validation/gse295849_skinblood_clock.py'
      - 'tests/test_gse295849_skinblood_clock.py'
      - 'validation/gse295849_metadata_bridge.py'
      - 'tests/test_gse295849_metadata_bridge.py'
      - 'validation/gse295849_paired_analysis.py'
      - 'tests/test_gse295849_paired_analysis.py'
      - 'validation/gse295849_fate_age_falsification.py'
      - 'tests/test_gse295849_fate_age_falsification.py'
      - 'validation/gse295849_rna_identity_gate.py'
      - 'tests/test_gse295849_rna_identity_gate.py'
      - 'tests/test_gse295849_open_ccby_rna.py'
      - 'validation/gse117720_open_rna_reference.py'
      - 'tests/test_gse117720_open_rna_reference.py'
      - 'reports/factory/GSE117720-PUBLIC-RNA-REFERENCE-METADATA-2026-11-02.json'
      - 'validation/gse295849_noncpg_lineage_residual.py'
      - 'tests/test_gse295849_noncpg_lineage_residual.py'
      - 'reports/factory/GSE295849-SRP594303-RNA-METADATA-2026-11-02.json'
      - 'validation/axolotl_human_reanalysis.py'
      - 'tests/test_axolotl_human_reanalysis.py'
      - 'tests/test_human_limb_regeneration_gate.py'
      - 'factory/control_plane.py'
      - 'tests/test_v6_organization.py'
      - 'tests/test_v7_factory.py'
      - '.github/workflows/scientific-organization.yml'
      - '.github/workflows/scientific-discovery-factory.yml'
      - '.github/workflows/biomimic-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'qa/**'
      - 'public/hunter*'
      - 'public/index.html'
      - 'public/buyer-demo.html'
      - 'app.js'
      - 'factory/million_euro_evidence.py'
      - '.github/workflows/biomimic-acceptance.yml'

permissions:
  contents: read

jobs:
  reproducible-science:
    name: Deterministic Acomys replay and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All project unit tests
        run: python -m unittest discover -s tests -v
      - name: Orthogonal RNA-seq public crosswalk and fail-closed restricted-access gate
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_rna_identity_gate.py --out qa-artifacts/GSE295849-ORTHOGONAL-RNA-ACCESS-GATE.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path("qa-artifacts/GSE295849-ORTHOGONAL-RNA-ACCESS-GATE.json").read_text())
          m=o["public_metadata"]
          assert m["rnaseq_run_count"]==48 and m["rnaseq_controlled_access_count"]==48
          assert m["condition_matched_RNA_runs"]==35
          assert m["independent_donors_with_RNA_D14_and_LP_condition_metadata"]==6
          assert o["status"]=="PARTIAL_NO_AUTHORIZED_TRANSCRIPTOME"
          assert m["age_effect_after_identity_adjustment"]=="UNVERIFIED"
          print("PASS_METADATA_BRIDGE; RNA_COUNTS_RESTRICTED; IDENTITY_ADJUSTED_BIOLOGY_UNVERIFIED")
          PY
      - name: Real open RNA independent identity control — Sheng 2018
        run: |
          mkdir -p qa-artifacts
          if python validation/gse117720_open_rna_reference.py --out qa-artifacts/GSE117720-REAL-RNA.json; then
            echo "PASS_PUBLIC_EXTERNAL_RNA_REAL_DATA"
          else
            echo "::warning title=Public RNA control::PARTIAL_REAL_SOURCE_OR_GENE_SYMBOL_FAILURE"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('qa-artifacts/GSE117720-REAL-RNA.json').read_text())
          assert x['2026_RNA_ADJUSTED_AGE']=='UNVERIFIED'
          assert x['reference_is_different_from_2026_six_donors']
          if x['status']=='PASS_INDEPENDENT_PUBLIC_2018_RNA_REFERENCE_ONLY':
              assert x['remote_source_hash_pinned_verified']
              assert x['independent_2018_RNA']['library_count']==19
          print('GSE117720_PUBLIC_EXTERNAL_RNA',x['status'],'NOT_MATCHED_TO_2026')
          PY
      - name: Replicate within-iNSC de-aging but retain fate negative controls
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_fate_age_falsification.py --out qa-artifacts/GSE295849-FATE-VS-AGE.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("qa-artifacts/GSE295849-FATE-VS-AGE.json").read_text())
          assert x["age_reset_independent_of_cell_fate"]=="UNVERIFIED"
          assert x["fate_matters"]=="YES_ALTERNATIVE_FATE_HAS_DIFFERENT_CLOCK_OUTPUT"
          assert x["same_label_time_course"]["iNSC_D14_to_LP"]["n_clock_decreases"]==6
          print("AGE_FATE_DISENTANGLEMENT_FALSIFICATION",x["status"],"separate_mechanism",x["age_reset_independent_of_cell_fate"])
          PY
      - name: Fail-closed axolotl to human limb evidence audit
        run: python factory/human_limb_regeneration_gate.py --no-write
      - name: Probe old/new axolotl assemblies and public DNA sequence provenance
        run: |
          python validation/hand2_assembly_sequence_probe.py --write
          mkdir -p qa-artifacts
          cp reports/factory/HAND2-ASSEMBLY-SEQUENCE-PROBE-LATEST.json qa-artifacts/HAND2-ASSEMBLY-SEQUENCE-PROBE.json
      - name: Exact-locus HAND1/HAND2 sequence-window alignment with negative controls
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --disable-pip-version-check edlib==1.3.9.post1
          python -m unittest tests.test_hand1_hand2_global_alignment -v
          python validation/hand1_hand2_global_alignment.py --write
          mkdir -p qa-artifacts
          cp reports/factory/HAND1-HAND2-ALIGNMENT-LATEST.json qa-artifacts/HAND1-HAND2-ALIGNMENT-LATEST.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path("reports/factory/HAND1-HAND2-ALIGNMENT-LATEST.json").read_text())
          assert r["old_locus_to_new_gene_exact_identity"]=="UNVERIFIED"
          print("HAND1_HAND2_ALIGNMENT_STATUS",r["status"],r["sha256"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n## Real HAND1/HAND2 nucleotide alignment\n")
              f.write("- Status: **"+r["status"]+"**\n")
              if r.get("results"):
                  for gene in ("hand1","hand2"):
                      b=r["results"][gene]["local"]["best"]
                      f.write("- "+gene+": local edit distance "+str(b["edit_distance"])+
                              "; aligned identity "+str(b["fraction_matching_in_alignment"])+
                              "; strand "+b["strand"]+"\n")
              f.write("- Exact legacy-to-modern locus identity: **UNVERIFIED** (whole-genome reciprocal uniqueness not tested)\n")
          PY
      - name: Predeclared 4-family axolotl paralog screen against real NCBI data
        run: |
          set -euo pipefail
          python -m unittest tests.test_axolotl_paralog_panel -v
          python validation/axolotl_paralog_panel.py --write
          cp reports/factory/AXOLOTL-PARALOG-PANEL-LATEST.json qa-artifacts/AXOLOTL-PARALOG-PANEL-LATEST.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("reports/factory/AXOLOTL-PARALOG-PANEL-LATEST.json")
          r=json.loads(p.read_text())
          assert r["scientific_identity_confirmation"]=="UNVERIFIED"
          assert r["status"]!="FAIL_IMPLEMENTATION"
          statuses={x["status"]:sum(y["status"]==x["status"] for y in r.get("cases",[])) for x in r.get("cases",[])}
          print("AXOLOTL_PARALOG_PANEL_STATUS",r["status"],"evaluated",r.get("evaluated_loci",0),"candidate_statuses",statuses,"sha256",r["sha256"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as w:
              w.write("\n## Prespecified non-representative paralog panel\n")
              w.write("- Status: **"+r["status"]+"**\n")
              w.write("- Successfully aligned distinct historical loci: **"+str(r.get("evaluated_loci",0))+"**\n")
              w.write("- Identity confirmation from independent curator: **UNVERIFIED**\n")
          PY
      - name: Verify HAND2 historic gene ID and NCBI orthology (fail-closed)
        run: |
          python validation/hand2_legacy_crosswalk.py --write
          mkdir -p qa-artifacts
          cp reports/factory/HAND2-LEGACY-CROSSWALK-2026-11-01.json qa-artifacts/HAND2-LEGACY-CROSSWALK.json
      - name: Real axolotl-human GEO comparison with fail-closed orthology
        run: |
          python validation/axolotl_human_reanalysis.py --write
          mkdir -p qa-artifacts
          cp reports/factory/AXOLOTL-HUMAN-TRANSCRIPTOMIC-LATEST.json qa-artifacts/axolotl-human-transcriptomic.json
      - name: Report GEO acquisition status (do not relabel missing inputs as PASS)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("reports/factory/AXOLOTL-HUMAN-TRANSCRIPTOMIC-LATEST.json")
          result = json.loads(p.read_text(encoding="utf-8"))
          status = str(result.get("status", "UNVERIFIED"))
          failures = result.get("failed_sources") or {}
          lines = ["## Real GEO acquisition (separate from software CI)", "",
                   f"- Scientific status: **{status}**",
                   f"- Failed sources: **{len(failures)}**"]
          for name, reason in sorted(failures.items()):
              lines.append(f"  - {name}: {reason}")
          if failures or status == "PARTIAL_SOURCE_FAILURE":
              print("::warning title=GEO acquisition incomplete::" + status +
                    " - failed sources: " + ", ".join(sorted(failures)))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Reproducible scientific evidence demonstration — two separate processes
        run: |
          set -euo pipefail
          PYTHONHASHSEED=17 python qa/repro_acomys.py --out qa-artifacts/replay-seed17.json
          sleep 2
          PYTHONHASHSEED=101 python qa/repro_acomys.py --out qa-artifacts/replay-seed101.json
          cmp qa-artifacts/replay-seed17.json qa-artifacts/replay-seed101.json
          echo 'PASS: deterministic evidence replay across processes/time/hash-seeds'
      - name: Save scientific evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomimic-science-replay
          path: qa-artifacts/
          if-no-files-found: warn

  real-epigenetic-geo:
    name: Genuine GSE295849 beta matrix ${{ matrix.part }} — strict QC
    if: github.event_name == 'workflow_dispatch' && inputs.science_mode == 'gse295849_qc'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ['1', '2', '3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and fully validate source part ${{ matrix.part }}
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_real_qc.py --part "${{ matrix.part }}" --out "qa-artifacts/GSE295849-BETA-${{ matrix.part }}-REAL-QC.json"
      - name: Preserve actual QC result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse295849-beta-${{ matrix.part }}-qc
          path: qa-artifacts/
          if-no-files-found: warn

  real-epigenetic-clock:
    name: GSE295849 Horvath2018 Skin&Blood 391-CpG real-data clock
    if: github.event_name == 'workflow_dispatch' && inputs.science_mode == 'gse295849_clock'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free open source CPU scientific dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install 'pyaging==0.5.7'
      - name: Validate pinned 391-CpG clock and score original GEO beta matrix 3
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_skinblood_clock.py --part 3 --out qa-artifacts/GSE295849-HORVATH2018-REAL-CLOCK-3.json
      - name: Retain clock result even when data or model fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse295849-horvath2018-real-clock
          path: qa-artifacts/
          if-no-files-found: warn

  real-gse295849-metadata:
    name: Official GEO sample and donor metadata provenance (GSE295849)
    if: github.event_name == 'workflow_dispatch' && inputs.science_mode == 'gse295849_metadata'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed sample crosswalk unit tests
        run: python -m unittest tests.test_gse295849_metadata_bridge -v
      - name: Audit 60-source-record snapshot (runner NCBI HTTP 403 not relabeled as live PASS)
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('reports/factory/GSE295849-REAL-SAMPLE-CROSSWALK-2026-11-02.json')
          d=json.loads(p.read_text())
          samples=d['samples']
          gsm=[s['gsm'] for s in samples]
          chips=[s['chip_sample_id'] for s in samples]
          assert len(samples)==60 and len(set(gsm))==60 and len(set(chips))==60
          assert all(re.fullmatch(r'GSM\d+',g) for g in gsm)
          assert all(re.fullmatch(r'\d{12}_R\d{2}C\d{2}',c) for c in chips)
          assert all(s['donor_genotype'] and s['harvest_stage'] and s['cell_type'] and s['treatment'] for s in samples)
          assert all(any(c in path for path in s['supplementary_files']) for c,s in zip(chips,samples))
          print('PASS_STORED_GEO_SAMPLE_SNAPSHOT_STRUCTURAL_AUDIT',len(samples))
          print('LIVE_FTP_METADATA_ACQUISITION_UNVERIFIED_IN_RUNNER: 403 in prior run')
          PY
      - name: Preserve complete sample metadata & uncertainty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse295849-real-metadata-join
          path: qa-artifacts/
          if-no-files-found: warn

  complete-gse295849-paired:
    name: Complete 60-sample methylation clock, 12-donor paired analysis
    if: github.event_name == 'workflow_dispatch' && inputs.science_mode == 'gse295849_paired'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public CPU-only methylation clock
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install 'pyaging==0.5.7'
      - name: Score pinned original NCBI matrices 1 and 2 (sequential transfers)
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_skinblood_clock.py --part 1 --out qa-artifacts/HORVATH-REAL-PART1.json
          python validation/gse295849_skinblood_clock.py --part 2 --out qa-artifacts/HORVATH-REAL-PART2.json
      - name: Compute 12 donor-matched contrasts, preserving unfavorable controls
        run: |
          python -m unittest tests.test_gse295849_paired_analysis -v
          python validation/gse295849_paired_analysis.py --part1 qa-artifacts/HORVATH-REAL-PART1.json --part2 qa-artifacts/HORVATH-REAL-PART2.json --part3 reports/factory/GSE295849-HORVATH2018-REAL-CLOCK-3.json --out qa-artifacts/GSE295849-12-DONOR-PAIRED-REAL.json
      - name: Save complete evidence, including failed transfers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse295849-60-sample-donor-paired-science
          path: qa-artifacts/
          if-no-files-found: warn

  browser-acceptance:
    name: Chromium end-to-end (mocked providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright-core without downloading browsers
        run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - name: Official GEO retry and fail-closed unit tests
        run: node --test qa/official-geo-fetch.test.mjs
      - name: Chromium test of actual published public folder
        run: |
          set -euo pipefail
          which google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/biomimic-server.log 2>&1 &
          echo $! >/tmp/biomimic-server.pid
          sleep 2
          node qa/browser-smoke.mjs
          node qa/live-browser-smoke.mjs
          node qa/acquisition-browser-smoke.mjs
          node qa/publication-live-smoke.mjs
      - name: Save browser failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomimic-ui-browser-evidence
          path: qa-artifacts/
          if-no-files-found: warn

  epigenome-fate-proxy-shards:
    # One-off real public methylation assay reanalysis for a single science PR.
    # Public GitHub repository: uses public runner, no private protected data.
    # No recurring cron or paid service. Does not claim RNA access.
    if: github.event_name == 'pull_request' && github.head_ref == 'science/open-rna-external-control-20261102'
    name: Independently quantify nonclock CpG lineage on genuine GEO part ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        part: ['1','2','3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and hash-pin real GSE295849 methylation shard
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_noncpg_lineage_residual.py --part ${{ matrix.part }} --out qa-artifacts/part${{ matrix.part }}.json.gz
      - name: Retain sampled clock-excluded CpG data for donor holdout
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bio-mimic-lineage-part-${{ matrix.part }}
          path: qa-artifacts/part${{ matrix.part }}.json.gz
          if-no-files-found: warn
          retention-days: 7

  epigenome-fate-proxy-paired:
    if: github.event_name == 'pull_request' && github.head_ref == 'science/open-rna-external-control-20261102'
    needs: [epigenome-fate-proxy-shards]
    name: One-donor-one-vote identity-control of real Horvath clock
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exactly three independently pinned CpG shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bio-mimic-lineage-part-*
          merge-multiple: true
          path: qa-artifacts/
      - name: Real 6-donor stage analysis with leave-donor-out nonclock CpG lineage proxy
        run: |
          python validation/gse295849_noncpg_lineage_residual.py --join qa-artifacts/part1.json.gz qa-artifacts/part2.json.gz qa-artifacts/part3.json.gz --out qa-artifacts/BIO-MIMIC-GSE295849-CELL-IDENTITY-PROXY.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('qa-artifacts/BIO-MIMIC-GSE295849-CELL-IDENTITY-PROXY.json').read_text())
          assert d['n_public_methylation_chips']==60
          assert d['n_actual_paired_D14_LP_donors']==6
          assert d['n_common_preselected_clock_excluded_CpGs']>=3000
          assert d['cell_fate_independent_rejuvenation']=='UNVERIFIED'
          assert d['orthogonal_transcriptomics']=='UNVERIFIED_PROTECTED_ACCESS'
          print('PASS_GENUINE_NONCLOCK_CPG_SENSITIVITY_MEASUREMENT__NOT_RNA')
          PY
      - name: Save reproducible six-donor evidence with negative controls
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bio-mimic-real-six-donor-nonclock-cell-identity
          path: qa-artifacts/BIO-MIMIC-GSE295849-CELL-IDENTITY-PROXY.json
          if-no-files-found: warn
          retention-days: 90
