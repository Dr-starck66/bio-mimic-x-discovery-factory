name: BIO-MIMIC X — UI and Scientific Acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'qa/**'
      - 'organization/**'
      - 'factory/human_limb_regeneration_gate.py'
      - 'validation/hand2_legacy_crosswalk.py'
      - 'validation/hand2_assembly_sequence_probe.py'
      - 'tests/test_hand2_assembly_sequence_probe.py'
      - 'tests/test_hand2_legacy_crosswalk.py'
      - 'validation/geo_pair_probe.py'
      - 'validation/gse295849_real_qc.py'
      - 'tests/test_gse295849_real_qc.py'
      - 'validation/gse295849_skinblood_clock.py'
      - 'tests/test_gse295849_skinblood_clock.py'
      - 'validation/axolotl_human_reanalysis.py'
      - 'tests/test_axolotl_human_reanalysis.py'
      - 'tests/test_human_limb_regeneration_gate.py'
      - 'factory/control_plane.py'
      - 'tests/test_v6_organization.py'
      - 'tests/test_v7_factory.py'
      - '.github/workflows/scientific-organization.yml'
      - '.github/workflows/scientific-discovery-factory.yml'
      - '.github/workflows/biomimic-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'qa/**'
      - 'public/hunter*'
      - 'public/index.html'
      - 'public/buyer-demo.html'
      - 'app.js'
      - 'factory/million_euro_evidence.py'
      - '.github/workflows/biomimic-acceptance.yml'

permissions:
  contents: read

jobs:
  reproducible-science:
    name: Deterministic Acomys replay and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All project unit tests
        run: python -m unittest discover -s tests -v
      - name: Fail-closed axolotl to human limb evidence audit
        run: python factory/human_limb_regeneration_gate.py --no-write
      - name: Probe old/new axolotl assemblies and public DNA sequence provenance
        run: |
          python validation/hand2_assembly_sequence_probe.py --write
          mkdir -p qa-artifacts
          cp reports/factory/HAND2-ASSEMBLY-SEQUENCE-PROBE-LATEST.json qa-artifacts/HAND2-ASSEMBLY-SEQUENCE-PROBE.json
      - name: Verify HAND2 historic gene ID and NCBI orthology (fail-closed)
        run: |
          python validation/hand2_legacy_crosswalk.py --write
          mkdir -p qa-artifacts
          cp reports/factory/HAND2-LEGACY-CROSSWALK-2026-11-01.json qa-artifacts/HAND2-LEGACY-CROSSWALK.json
      - name: Real axolotl-human GEO comparison with fail-closed orthology
        run: |
          python validation/axolotl_human_reanalysis.py --write
          mkdir -p qa-artifacts
          cp reports/factory/AXOLOTL-HUMAN-TRANSCRIPTOMIC-LATEST.json qa-artifacts/axolotl-human-transcriptomic.json
      - name: Report GEO acquisition status (do not relabel missing inputs as PASS)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("reports/factory/AXOLOTL-HUMAN-TRANSCRIPTOMIC-LATEST.json")
          result = json.loads(p.read_text(encoding="utf-8"))
          status = str(result.get("status", "UNVERIFIED"))
          failures = result.get("failed_sources") or {}
          lines = ["## Real GEO acquisition (separate from software CI)", "",
                   f"- Scientific status: **{status}**",
                   f"- Failed sources: **{len(failures)}**"]
          for name, reason in sorted(failures.items()):
              lines.append(f"  - {name}: {reason}")
          if failures or status == "PARTIAL_SOURCE_FAILURE":
              print("::warning title=GEO acquisition incomplete::" + status +
                    " - failed sources: " + ", ".join(sorted(failures)))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Reproducible scientific evidence demonstration — two separate processes
        run: |
          set -euo pipefail
          PYTHONHASHSEED=17 python qa/repro_acomys.py --out qa-artifacts/replay-seed17.json
          sleep 2
          PYTHONHASHSEED=101 python qa/repro_acomys.py --out qa-artifacts/replay-seed101.json
          cmp qa-artifacts/replay-seed17.json qa-artifacts/replay-seed101.json
          echo 'PASS: deterministic evidence replay across processes/time/hash-seeds'
      - name: Save scientific evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomimic-science-replay
          path: qa-artifacts/
          if-no-files-found: warn

  real-epigenetic-geo:
    name: Genuine GSE295849 beta matrix ${{ matrix.part }} — strict QC
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ['1', '2', '3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and fully validate source part ${{ matrix.part }}
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_real_qc.py --part "${{ matrix.part }}" --out "qa-artifacts/GSE295849-BETA-${{ matrix.part }}-REAL-QC.json"
      - name: Preserve actual QC result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse295849-beta-${{ matrix.part }}-qc
          path: qa-artifacts/
          if-no-files-found: warn

  real-epigenetic-clock:
    name: GSE295849 Horvath2018 Skin&Blood 391-CpG real-data clock
    if: github.event_name == 'pull_request' && github.head_ref == 'science/gse295849-skin-blood-clock-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free open source CPU scientific dependencies
        run: python -m pip install 'pyaging==0.5.7'
      - name: Validate pinned 391-CpG clock and score original GEO beta matrix 3
        run: |
          mkdir -p qa-artifacts
          python validation/gse295849_skinblood_clock.py --part 3 --out qa-artifacts/GSE295849-HORVATH2018-REAL-CLOCK-3.json
      - name: Retain clock result even when data or model fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse295849-horvath2018-real-clock
          path: qa-artifacts/
          if-no-files-found: warn

  browser-acceptance:
    name: Chromium end-to-end (mocked providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright-core without downloading browsers
        run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - name: Official GEO retry and fail-closed unit tests
        run: node --test qa/official-geo-fetch.test.mjs
      - name: Chromium test of actual published public folder
        run: |
          set -euo pipefail
          which google-chrome
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/biomimic-server.log 2>&1 &
          echo $! >/tmp/biomimic-server.pid
          sleep 2
          node qa/browser-smoke.mjs
          node qa/live-browser-smoke.mjs
          node qa/acquisition-browser-smoke.mjs
          node qa/publication-live-smoke.mjs
      - name: Save browser failure screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomimic-ui-browser-evidence
          path: qa-artifacts/
          if-no-files-found: warn
