name: BIO-MIMIC X Human Translation 9-of-9 Gate
# translation-gate-9of9-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/human-bridge-refresh-once.yml'

permissions:
  contents: write

concurrency:
  group: biomimic-human-bridge-5of9-once
  cancel-in-progress: true

jobs:
  bridge-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Human Bridge + Translation unit tests
        run: python -m unittest tests.test_human_bridge tests.test_translation_paths -v

      - name: Recompute latest Human Bridge
        run: python human_bridge_refresh.py

      - name: Require strict 5-of-9 and translation 9-of-9
        run: |
          python - <<'PY'
          import json, pathlib
          x=json.loads(pathlib.Path("state/factory/latest.json").read_text(encoding="utf-8"))
          h=x["human_bridge_result"]
          t=x["human_translation_result"]
          print({
            "supported_claims":len(x["claims"]),
            "strict_orthology_candidates":t["strict_orthology_candidates"],
            "strict_orthology_coverage":t["strict_orthology_coverage_ratio"],
            "translation_verified_candidates":t["translation_verified_candidates"],
            "translation_coverage":t["translation_coverage_ratio"],
            "path_type_counts":t["path_type_counts"],
            "providers":h["provider_status"]
          })
          assert len(x["claims"])==9, len(x["claims"])
          assert h["attempted_candidates"]==9, h["attempted_candidates"]
          assert h["bridged_candidates"]>=5, h["candidate_status"]
          assert t["strict_orthology_candidates"]>=5, t["candidate_status"]
          assert t["translation_verified_candidates"]==9, t["candidate_status"]
          assert t["translation_coverage_ratio"]==1.0, t["candidate_status"]
          assert all(p.get("clinical_efficacy_claim") is False for p in t["paths"])
          PY

      - name: Persist verified Human Translation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BIO-MIMIC-X-HUMAN-BRIDGE"
          git config user.email "biomimic-x-human-bridge@users.noreply.github.com"
          git add state/factory/latest.json public/data/factory/latest.json reports/factory/HUMAN-BRIDGE-LATEST.md
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "bridge: persist verified Human Bridge coverage"
            git push origin HEAD:main
          fi
