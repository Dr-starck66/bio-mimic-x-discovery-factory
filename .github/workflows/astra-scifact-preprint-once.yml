name: ASTRA Ω SciFact preprint — one-time Zenodo release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-scifact-preprint-once.yml'

permissions:
  contents: write

jobs:
  publish-scifact-preprint:
    if: github.repository == 'Dr-starck66/bio-mimic-x-discovery-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check archived snapshot is manuscript-only (no code or datasets)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILES="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/7e06e9d167d2bc4c015fb7a7d64b4c81f748386a" --jq '[.tree[].path] | sort | join(",")')"
          test "$FILES" = '.zenodo.json,README.md,preprint.md'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/080670e0de62144d5fbe9f4b5a45c78f9aee0ab3" --jq '.tree.sha')" = '7e06e9d167d2bc4c015fb7a7d64b4c81f748386a'

      - name: Create exactly one release if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='scifact-open-preprint-v0.5'
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to duplicate"
            exit 0
          fi
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --target '080670e0de62144d5fbe9f4b5a45c78f9aee0ab3' \
            --title 'Dr Starck — Oracle-Free Retrieval and Selective Scientific-Claim Verification (Open Preprint v0.5)' \
            --notes 'Author-approved public preprint under CC BY 4.0 (original manuscript only). This release archives ONLY preprint.md, README.md and .zenodo.json. Exploratory SciFact development-set audit; NOT peer-reviewed and NOT clinically validated. The third-party SciFact dataset and model weights are excluded. Source evidence: https://github.com/Dr-starck66/bio-mimic-x-discovery-factory/pull/48' \
            --latest=false
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json url,tagName,isDraft,isPrerelease,targetCommitish
      - name: Verify public Zenodo DOI without inventing one
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          needle = "Oracle-Free Retrieval and Selective Scientific-Claim Verification"
          q = 'title:"' + needle + '"'
          url = 'https://zenodo.org/api/records/?' + urllib.parse.urlencode({"q": q, "size": "50"})
          for attempt in range(1, 5):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "ASTRA-Research-DOI-Verify/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      records = json.load(response).get("hits", {}).get("hits", [])
                  for record in records:
                      md = record.get("metadata", {})
                      title = md.get("title", "")
                      authors = [c.get("person_or_org", {}).get("name", c.get("name", "")) for c in md.get("creators", [])]
                      doi = record.get("doi") or record.get("pids", {}).get("doi", {}).get("identifier")
                      if needle.lower() in title.lower() and any("starck" in x.lower() for x in authors) and doi:
                          print(json.dumps({"ZENODO_DOI":"PASS","doi":doi,"url":record.get("links",{}).get("self_html", "https://doi.org/"+doi),"record_id":record.get("id")}))
                          raise SystemExit(0)
                  print("ZENODO_DOI_UNVERIFIED attempt", attempt, "candidate_records", len(records))
              except Exception as error:
                  print("ZENODO_LOOKUP_ERROR", attempt, str(error)[:220])
              if attempt < 4: time.sleep(8)
          print("ZENODO_DOI_UNVERIFIED: no verified matching public DOI at this time")
          PY

