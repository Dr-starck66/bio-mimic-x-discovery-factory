name: ASTRA Ω SciFact preprint — one-time Zenodo release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-scifact-preprint-once.yml'

permissions:
  contents: write

jobs:
  publish-scifact-preprint:
    if: github.repository == 'Dr-starck66/bio-mimic-x-discovery-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check archived snapshot is manuscript-only (no code or datasets)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILES="$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/7e06e9d167d2bc4c015fb7a7d64b4c81f748386a" --jq '[.tree[].path] | sort | join(",")')"
          test "$FILES" = '.zenodo.json,README.md,preprint.md'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/080670e0de62144d5fbe9f4b5a45c78f9aee0ab3" --jq '.tree.sha')" = '7e06e9d167d2bc4c015fb7a7d64b4c81f748386a'

      - name: Create exactly one release if none exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='scifact-open-preprint-v0.5'
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to duplicate"
            exit 0
          fi
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --target '080670e0de62144d5fbe9f4b5a45c78f9aee0ab3' \
            --title 'Dr Starck — Oracle-Free Retrieval and Selective Scientific-Claim Verification (Open Preprint v0.5)' \
            --notes 'Author-approved public preprint under CC BY 4.0 (original manuscript only). This release archives ONLY preprint.md, README.md and .zenodo.json. Exploratory SciFact development-set audit; NOT peer-reviewed and NOT clinically validated. The third-party SciFact dataset and model weights are excluded. Source evidence: https://github.com/Dr-starck66/bio-mimic-x-discovery-factory/pull/48' \
            --latest=false
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json url,tagName,isDraft,isPrerelease,targetCommitish
      - name: Verify public Zenodo DOI without inventing one
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          needle = "Oracle-Free Retrieval and Selective Scientific-Claim Verification"
          probes = [
              ("zenodo", "https://zenodo.org/api/records?" + urllib.parse.urlencode({"q":"SciFact","size":"50"})),
              ("zenodo", "https://zenodo.org/api/records?" + urllib.parse.urlencode({"q":"Starck","size":"50"})),
              ("datacite", "https://api.datacite.org/dois?" + urllib.parse.urlencode({"query":"SciFact", "page[size]":"100"})),
          ]
          for source, url in probes:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"ASTRA-Research-DOI-Verify/1.1 (+https://github.com/Dr-starck66/bio-mimic-x-discovery-factory)","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=18) as response:
                      obj = json.load(response)
                  items = obj.get("hits", {}).get("hits", []) if source == "zenodo" else obj.get("data", [])
                  print("LOOKUP_OK",source,"items",len(items))
                  for item in items:
                      md = item.get("metadata", {}) if source == "zenodo" else item.get("attributes", {})
                      title = md.get("title","") if source == "zenodo" else "\\n".join(md.get("titles", [{}])[0].get("title","") for _ in [0])
                      authors = [str(c.get("name",c.get("person_or_org",{}).get("name",""))) for c in md.get("creators", [])]
                      if source == "datacite" and not authors:
                          authors = [str(c.get("name","")) for c in md.get("creators", [])]
                      doi = (item.get("doi") or item.get("pids",{}).get("doi",{}).get("identifier")) if source == "zenodo" else md.get("doi")
                      if needle.lower() in title.lower() and any("starck" in a.lower() for a in authors) and doi:
                          print("ZENODO_DOI_PASS", json.dumps({"doi":doi,"source":source,"url":"https://doi.org/"+doi,"record_id":item.get("id")}))
                          raise SystemExit(0)
              except Exception as error:
                  detail = str(error)
                  if hasattr(error,"read"):
                      try: detail += " "+error.read(350).decode("utf-8","replace")
                      except Exception: pass
                  print("ZENODO_LOOKUP_ERROR",source,detail[:550])
          print("ZENODO_DOI_UNVERIFIED: no matching DOI in accessible public indexes")
          PY
      - name: Audit exact Zenodo record, licence, and archived files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          doi="10.5281/zenodo.24262785"
          url="https://zenodo.org/api/records/24262785"
          try:
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"ASTRA-Research-Metadata-Audit/1.0"})
              with urllib.request.urlopen(req,timeout=18) as response:
                  record=json.load(response)
              metadata=record.get("metadata",{})
              title=str(metadata.get("title",""))
              record_doi=record.get("doi") or record.get("pids",{}).get("doi",{}).get("identifier")
              creators=metadata.get("creators",[])
              names=[str(c.get("person_or_org",{}).get("name",c.get("name",""))) for c in creators]
              file_field=record.get("files",[])
              files=file_field.get("entries",{}) if isinstance(file_field,dict) else file_field
              if isinstance(files,list): filenames=[x.get("key","") for x in files]
              else: filenames=list(files.keys())
              licence=metadata.get("rights",metadata.get("license",{}))
              ok=(record_doi==doi and "Oracle-Free Retrieval" in title and any("starck" in x.lower() for x in names))
              print("ZENODO_EXACT_RECORD_"+("PASS" if ok else "FAIL"),json.dumps({"doi":record_doi,"title":title,"authors":names,"record_id":record.get("id"),"files":filenames,"rights":licence,"link":record.get("links",{}).get("self_html")},ensure_ascii=False)[:2500])
              if not ok: raise SystemExit(1)
          except Exception as error:
              print("ZENODO_EXACT_RECORD_UNVERIFIED",str(error)[:450])
          PY
