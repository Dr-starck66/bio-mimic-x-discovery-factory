name: BIO-MIMIC X HAND2 — direct sequence proof (manual-free, nonrecurring)
on:
  push:
    branches:
      - science/hand2-chr6q-preflight-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hand2-direct:
    name: Direct historical HAND2 vs RefSeq HAND2, HAND1 negative control
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free pinned exact alignment library
        run: python -m pip install --only-binary=:all: --disable-pip-version-check edlib==1.3.9.post1
      - name: Validate observed provenance and negative controls
        run: python -m unittest tests.test_hand2_direct_reciprocal -v
      - name: Run NCBI exact-sequence comparison and persist raw result
        run: |
          mkdir -p qa-artifacts
          python -m validation.hand2_direct_reciprocal --out qa-artifacts/HAND2-DIRECT-RECIPROCAL.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("qa-artifacts/HAND2-DIRECT-RECIPROCAL.json").read_text())
          assert d["scientific_identity"] == "UNVERIFIED"
          if d["status"]=="PARTIAL_TARGETED_RECIPROCAL_WINDOWS":
              assert len(d["fasta_sha256"]) == 3
          print("DIRECT_HAND2_EVIDENCE",d["status"],"sources",len(d.get("fasta_sha256",{})),"controls",d.get("comparisons",{}).get("favors_HAND2_over_HAND1_in_tested_windows"))
          PY
      - name: Preserve favorable and negative evidence for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand2-direct-proof-once
          path: qa-artifacts/HAND2-DIRECT-RECIPROCAL.json
          retention-days: 30
          if-no-files-found: warn
