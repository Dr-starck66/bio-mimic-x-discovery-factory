name: ASTRA Research - one-shot two approved PDF preprints
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-research-two-preprints-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - code: quantum
            branch: research-quantum-maxcut-v01
            tag: astra-quantum-maxcut-preprint-v0.1
            title: "Dr Starck - QAOA vs Classical MaxCut - Open Preprint v0.1"
          - code: ant
            branch: research-ant-stuttgart-v01
            tag: astra-ant-stuttgart-preprint-v0.1
            title: "Dr Starck - Stuttgart Robotic Construction Audit - Open Preprint v0.1"
    steps:
      - name: Checkout vetted publisher tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: publisher
          persist-credentials: false

      - name: Checkout isolated author-approved paper
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: manuscript
          fetch-depth: 1
          persist-credentials: true

      - name: Author, rights and exact source inventory preflight
        working-directory: manuscript
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree --name-only HEAD | sort | paste -sd, -)" = ".zenodo.json,README.md,preprint.md"
          python - <<'PY'
          import pathlib,json
          s=pathlib.Path('preprint.md').read_text()
          md=json.loads(pathlib.Path('.zenodo.json').read_text())
          assert len(s)>8000 and '**Author:** Dr Starck' in s
          assert 'CC BY 4.0' in s and 'NOT PEER REVIEWED' in s.upper()
          assert 'PRIVATE DRAFT' not in s
          assert md['creators'][0]['name']=='Dr Starck'
          assert md['publication_type']=='preprint' and md['license']=='cc-by-4.0'
          assert all(x not in s for x in ['password=', 'api_key=', 'sk-proj-'])
          print('SOURCE_PASS',len(s),md['title'])
          PY

      - name: Install open-source PDF dependencies
        run: python -m pip install --quiet --disable-pip-version-check 'reportlab>=4,<5' 'mistune>=3,<4' 'pypdf>=5,<7'

      - name: Render accessible scientific PDF
        working-directory: manuscript
        run: python ../publisher/tools/astra-publication/render_preprint.py

      - name: Validate PDF structure, author, pages, extracted text
        working-directory: manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          r=PdfReader('preprint.pdf')
          s='\n'.join(p.extract_text() or '' for p in r.pages)
          assert 2<=len(r.pages)<=25, len(r.pages)
          assert r.metadata.author=='Dr Starck',r.metadata
          assert len(s)>6500,len(s)
          assert 'Dr Starck' in s and 'CC BY 4.0' in s
          assert 'NOT PEER REVIEWED' in s.upper()
          print('PDF_AUDIT_PASS',len(r.pages),len(s),Path('preprint.pdf').stat().st_size)
          PY

      - name: Freeze four-file preprint snapshot with PDF
        working-directory: manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "astra-research-release-bot"
          git config user.email "astra-research-release-bot@users.noreply.github.com"
          git add -- preprint.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(research): attach tested preprint PDF for public archive"
            git push origin HEAD:refs/heads/${{ matrix.branch }}
          fi
          test "$(git ls-tree --name-only HEAD | sort | paste -sd, -)" = ".zenodo.json,README.md,preprint.md,preprint.pdf"
          echo "EXACT_FOUR_FILE_ARCHIVE_PASS $(git rev-parse HEAD)"

      - name: Create authorized release and attach directly accessible PDF
        working-directory: manuscript
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ matrix.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS_SKIP_DUPLICATE $TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "${{ matrix.title }}" \
              --notes 'Dr Starck ASTRA Omega Research author-approved non-peer-reviewed open preprint. CC BY 4.0 on original manuscript only. The archive contains only preprint.pdf, preprint.md, README.md and .zenodo.json, without third-party datasets, software, secrets, or sensitive material. No unsupported physical or quantum advantage claim.' \
              --latest=false
          fi
          gh release upload "$TAG" preprint.pdf --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease,targetCommitish,assets
