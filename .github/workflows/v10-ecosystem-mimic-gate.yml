name: BIO-MIMIC X V10 ECOSYSTEM-MIMIC Gate

on:
  pull_request:
    paths:
      - 'factory/ecosystem_mimic.py'
      - 'factory/ecosystem_gbif_ingest.py'
      - 'data/ecosystem_sources.json'
      - 'tests/test_ecosystem_gbif_ingest.py'
      - 'factory/control_plane.py'
      - 'factory/brick_registry.json'
      - 'tests/test_ecosystem_mimic.py'
      - 'data/ecosystem_mimic_observations.json'
      - '.github/workflows/v10-ecosystem-mimic-gate.yml'
  push:
    branches: [main]
    paths:
      - 'factory/ecosystem_mimic.py'
      - 'factory/ecosystem_gbif_ingest.py'
      - 'data/ecosystem_sources.json'
      - 'tests/test_ecosystem_gbif_ingest.py'
      - 'factory/control_plane.py'
      - 'factory/brick_registry.json'
      - 'tests/test_ecosystem_mimic.py'
      - 'data/ecosystem_mimic_observations.json'
      - '.github/workflows/v10-ecosystem-mimic-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile factory/ecosystem_mimic.py factory/control_plane.py

      - name: ECOSYSTEM-MIMIC unit tests
        run: python -m unittest tests.test_ecosystem_mimic -v

      - name: Full repository tests
        run: python -m unittest discover -s tests -v

      - name: Brick audit
        run: python factory/brick_audit.py

      - name: Production evidence provenance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/ecosystem_mimic_observations.json").read_text(encoding="utf-8"))
          obs=x.get("observations",[])
          if not obs:
              assert x.get("ecosystem_id")=="unconfigured"
              print("PASS: empty bootstrap scaffold; no synthetic production evidence")
          else:
              assert x.get("generated_by")=="factory/ecosystem_gbif_ingest.py"
              assert x.get("source",{}).get("provider")=="GBIF"
              assert x.get("measurement_semantics")=="GBIF_OCCURRENCE_RECORD_COUNT_NOT_ABUNDANCE"
              assert all(o.get("provenance",{}).get("provider")=="GBIF" for o in obs)
              assert all(len(o.get("provenance",{}).get("record_id_sha256",""))==64 for o in obs)
              assert all(o.get("measurement_semantics","").endswith("NOT_ABUNDANCE") for o in obs)
              print(f"PASS: {len(obs)} source-traceable GBIF monthly observations")
          PY
