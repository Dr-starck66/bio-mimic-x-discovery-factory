name: BIO-MIMIC X OMA Exact Sequence Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oma-exact-cynops-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Probe exact Cynops SHH sequence in OMA
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          def read(url,accept="application/json"):
              req=urllib.request.Request(url,headers={"User-Agent":"BIO-MIMIC-X","Accept":accept})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode()

          fasta=read("https://rest.uniprot.org/uniprotkb/Q90385.fasta","text/plain")
          seq="".join(x.strip() for x in fasta.splitlines() if not x.startswith(">"))
          params=urllib.parse.urlencode({
              "query":seq,
              "search":"exact",
              "full_length":"true"
          })
          try:
              raw=read("https://omabrowser.org/api/sequence/?"+params)
              data=json.loads(raw)
              print("OMA_SEQUENCE_EXACT",json.dumps(data,indent=2)[:20000])
              entries=[]
              if isinstance(data,list): entries=data
              elif isinstance(data,dict):
                  for k in ("results","data"):
                      if isinstance(data.get(k),list): entries.extend(data[k])
                  if data.get("entry_nr") or data.get("omaid"): entries.append(data)
              for e in entries[:10]:
                  eid=e.get("entry_nr") or e.get("omaid") or e.get("canonicalid")
                  if not eid: continue
                  try:
                      d=json.loads(read(f"https://omabrowser.org/api/protein/{urllib.parse.quote(str(eid))}/orthologs/"))
                      hum=[x for x in d if (x.get("species") or {}).get("taxon_id")==9606]
                      print("ENTRY",eid,"SPECIES",(e.get("species") or {}),"HUMAN",json.dumps(hum[:10])[:12000])
                  except Exception as ex:
                      print("ORTHO_ERR",eid,repr(ex))
          except Exception as e:
              print("OMA_SEQUENCE_ERR",repr(e))
          PY
