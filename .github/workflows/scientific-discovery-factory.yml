name: BIO-MIMIC X V7 Scientific Discovery Factory

on:
  workflow_dispatch:
  # No additional scheduled task: test a code repair on the existing workflow.
  push:
    branches: [main]
    paths:
      - 'organization/lab_worker.py'
      - 'organization/committee.py'
      - 'factory/control_plane.py'
      - '.github/workflows/scientific-organization.yml'
      - '.github/workflows/scientific-discovery-factory.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: biomimic-v7-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specialist-labs:
    strategy:
      fail-fast: false
      matrix:
        lab: [cancer, regeneration, neuro, immunology, longevity, metabolism, preservation]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run specialist lab
        run: python organization/lab_worker.py --lab "${{ matrix.lab }}" --out "organization/output/labs/${{ matrix.lab }}.json"
      - uses: actions/upload-artifact@v6
        with:
          name: lab-${{ matrix.lab }}
          path: organization/output/labs/${{ matrix.lab }}.json
          if-no-files-found: error

  committee-and-factory:
    needs: specialist-labs
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: lab-*
          path: downloaded-labs
          merge-multiple: true
      - name: Assemble lab outputs
        run: |
          mkdir -p organization/output/labs
          cp downloaded-labs/*.json organization/output/labs/
      - name: Static + brick audit
        run: |
          python -m unittest discover -s tests -v
          python factory/brick_audit.py
      - name: Scientific Investment Committee
        id: committee
        run: |
          python organization/committee.py
          python - <<'PY'
          import json, pathlib, os
          receipt=json.loads(pathlib.Path("state/org/run_receipt.json").read_text(encoding="utf-8"))
          assert receipt["status"] in ("PASS","PARTIAL")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("status="+receipt["status"]+"\n")
          print("Committee scientific status:",receipt["status"])
          PY
      - name: Report upstream unavailable without replacing verified scientific state
        if: steps.committee.outputs.status == 'PARTIAL'
        run: |
          python - <<'PY'
          import json, pathlib
          x=json.loads(pathlib.Path("state/org/run_receipt.json").read_text(encoding="utf-8"))
          assert x["status"]=="PARTIAL"
          assert x["upstream_failures"] or not x["portfolio"]
          assert len(x["sha256"])==64
          print("PARTIAL: insufficient provider/portfolio evidence; previous validated state untouched")
          PY
      - name: Scientific Discovery Factory
        if: steps.committee.outputs.status == 'PASS'
        run: python factory/control_plane.py --committee state/org/latest.json
      - name: Evidence-based final validation
        if: steps.committee.outputs.status == 'PASS'
        run: |
          python - <<'PY'
          import json, pathlib
          x=json.loads(pathlib.Path("state/factory/run_receipt.json").read_text(encoding="utf-8"))
          assert x["status"] in ("PASS","PARTIAL")
          assert x["unused_active_bricks"]==[]
          assert len(x["sha256"])==64
          usage=x["brick_usage"]
          reg=json.loads(pathlib.Path("factory/brick_registry.json").read_text(encoding="utf-8"))
          assert len({e["brick_id"] for e in usage})==len(reg["active"])
          assert pathlib.Path("reports/factory/LATEST.md").exists()
          if x["status"]=="PASS":
              assert x["programs"] and x["claims"] and x["experiments"]
              latest=json.loads(pathlib.Path("state/factory/latest.json").read_text(encoding="utf-8"))
              assert latest["sha256"]==x["sha256"]
          print(x["status"]+": factory evidence validated; no unsupported claims promoted")
          PY
      - name: Commit learned scientific state
        run: |
          git config user.name "BIO-MIMIC-X-DISCOVERY-FACTORY"
          git config user.email "biomimic-x-factory@users.noreply.github.com"
          git add state reports public/data
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "factory: autonomous daily scientific program cycle"
            # GitHub's branch may advance while independent ASTRA workflows run.
            # Reconcile non-conflicting commits; never force-push scientific evidence.
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Scientific state published (attempt ${attempt})."
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Publication rejected after four attempts; no force push."
                exit 1
              fi
              git fetch --no-tags origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Concurrent changes conflict; remote evidence preserved."
                exit 1
              fi
              # Recheck code compatibility after integrating concurrent changes.
              python -m unittest discover -s tests -q
            done
          fi
