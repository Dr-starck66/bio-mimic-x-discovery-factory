name: BIO-MIMIC X V9 Deterministic Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v9-runtime-deterministic.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Execute actual control plane without external-provider latency
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(".").resolve()
          sys.path.insert(0,str(root/"factory"))
          import control_plane

          def deterministic_bridge(claims):
              return {
                  "status":"PARTIAL",
                  "attempted_candidates":len(claims),
                  "resolved_species":0,
                  "bridged_candidates":0,
                  "coverage_ratio":0,
                  "orthologue_hits":0,
                  "open_targets_hits":0,
                  "bridges":[],
                  "candidate_status":[
                      {"candidate":c["subject"],"status":"PROVIDER_BYPASSED_FOR_V9_RUNTIME_GATE","bridges":0}
                      for c in claims
                  ],
                  "provider_status":{"deterministic-runtime-gate":"BYPASS_EXTERNAL_NETWORK"}
              }

          control_plane.build_human_bridges=deterministic_bridge
          cycle=control_plane.run_cycle(root/"state/org/latest.json")

          reg=json.loads((root/"factory/brick_registry.json").read_text(encoding="utf-8"))
          active={b["id"] for b in reg["active"]}
          used={e["brick_id"] for e in cycle["brick_usage"]}
          reasoning=cycle.get("scientific_reasoning",[])

          assert used==active, {"missing":sorted(active-used),"unexpected":sorted(used-active)}
          assert len(active)==25
          assert reasoning
          assert len(reasoning)==len(cycle["experiments"])
          assert all(d["hypotheses"] for d in reasoning)
          assert all(d["debate"]["ranked"] for d in reasoning)
          assert all(d["experiment_plans"] for d in reasoning)
          assert all(d["claims_established_truth"] is False for d in reasoning)
          assert all(d["experiments_executed"] is False for d in reasoning)
          assert all(d["clinical_efficacy_claim"] is False for d in reasoning)
          mem=root/"state/factory/scientific_reasoning_memory.json"
          assert mem.exists()
          m=json.loads(mem.read_text(encoding="utf-8"))
          assert len(m["hypotheses"])>=len(reasoning)

          print({
              "status":"PASS",
              "factory_status":cycle["status"],
              "active_bricks":len(active),
              "used_bricks":len(used),
              "reasoning_dossiers":len(reasoning),
              "hypotheses":sum(len(d["hypotheses"]) for d in reasoning),
              "survivors":sum(len(d["debate"]["surviving_hypothesis_ids"]) for d in reasoning),
              "experiment_plans":sum(len(d["experiment_plans"]) for d in reasoning),
              "memory_hypotheses":len(m["hypotheses"])
          })
          PY
